<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Two Product objects created from the Product class</title>
  <desc id="desc">The Product class points to two separate object instances, product1 and product2, each with its own code, description, and price values.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf7"/>
      <stop offset="1" stop-color="#f5f2ef"/>
    </linearGradient>
    <linearGradient id="class" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff671d"/>
      <stop offset="1" stop-color="#d94e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f0f0f" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#a33c08" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1100" height="650" rx="32" fill="url(#bg)"/>
  <circle cx="985" cy="106" r="62" fill="#ff671d" opacity=".12"/>
  <circle cx="104" cy="548" r="72" fill="#ff671d" opacity=".1"/>
  <text x="550" y="68" text-anchor="middle" fill="#0f0f0f" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">ONE BLUEPRINT, MANY DISTINCT OBJECTS</text>
  <g filter="url(#shadow)">
    <rect x="405" y="104" width="290" height="128" rx="22" fill="url(#class)"/>
    <text x="550" y="157" text-anchor="middle" fill="#0f0f0f" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">CLASS</text>
    <text x="550" y="198" text-anchor="middle" fill="#0f0f0f" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Product</text>
  </g>
  <path d="M500 242 C440 280 333 286 288 340" fill="none" stroke="#a33c08" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 242 C660 280 767 286 812 340" fill="none" stroke="#a33c08" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="550" y="300" text-anchor="middle" fill="#59534f" font-family="Segoe UI, Arial, sans-serif" font-size="17">instantiation</text>
  <g filter="url(#shadow)">
    <rect x="90" y="340" width="420" height="242" rx="22" fill="#fff"/>
    <path d="M112 340h376a22 22 0 0 1 22 22v48H90v-48a22 22 0 0 1 22-22z" fill="#ffeadf"/>
    <text x="300" y="383" text-anchor="middle" fill="#0f0f0f" font-family="Cascadia Code, Consolas, monospace" font-size="27" font-weight="700">product1</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="19" fill="#0f0f0f">
      <text x="132" y="453">code</text><text x="245" y="453" fill="#a33c08">"MUG-101"</text>
      <text x="132" y="493">description</text><text x="292" y="493" fill="#a33c08">"Blue mug"</text>
      <text x="132" y="533">price</text><text x="245" y="533" fill="#a33c08">$12.50</text>
    </g>
    <rect x="590" y="340" width="420" height="242" rx="22" fill="#fff"/>
    <path d="M612 340h376a22 22 0 0 1 22 22v48H590v-48a22 22 0 0 1 22-22z" fill="#f0ece8"/>
    <text x="800" y="383" text-anchor="middle" fill="#0f0f0f" font-family="Cascadia Code, Consolas, monospace" font-size="27" font-weight="700">product2</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="19" fill="#0f0f0f">
      <text x="632" y="453">code</text><text x="745" y="453" fill="#a33c08">"BOOK-204"</text>
      <text x="632" y="493">description</text><text x="792" y="493" fill="#a33c08">"Python guide"</text>
      <text x="632" y="533">price</text><text x="745" y="533" fill="#a33c08">$24.00</text>
    </g>
  </g>
  <text x="550" y="622" text-anchor="middle" fill="#59534f" font-family="Segoe UI, Arial, sans-serif" font-size="16">Each object has its own identity and its own attribute values</text>
</svg>
